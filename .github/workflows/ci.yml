---
name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint JavaScript and CSS
        run: npm run lint
      - name: MegaLinter
        run: ./scripts/lint -c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
