---
name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: MegaLinter
        run: ./scripts/lint -c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Check generated content
        run: |
          pip install -r requirements.txt
          python scripts/data_pipeline/generate_content.py --check
          python -m compileall -q scripts/data_pipeline
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check and build frontend
        run: |
          npm ci
          npm run lint
          npm run build -- --no-cache
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify generated site
        run: |
          test -s _site/index.html
          test -s _site/datasets/index.html
          test -s _site/offices/index.html
          test -s _site/categories/index.html
          test -s _site/status/index.html
          test -s _site/sitemap.xml
          test -s _site/assets/js/dist/index.js
          jq empty _site/datasets.json
          jq empty _site/datasets-full.json
