name: Fetch Baserow Data

on:
  workflow_dispatch:
  schedule:
    - cron: "00 05 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6.0.2
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Fetch Baserow snapshots
        run: python scripts/data_pipeline/fetch_baserow.py
        env:
          BASEROW_ACCESS_TOKEN: ${{ secrets.BASEROW_ACCESS_TOKEN }}
      - name: Generate portal content
        run: python scripts/data_pipeline/generate_content.py
      - name: Commit synchronized data and content
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Sync portal content from Baserow
          branch: main
