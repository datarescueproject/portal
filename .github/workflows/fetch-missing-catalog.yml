name: Fetch missing government data

on:
  workflow_dispatch:
  schedule:
    - cron: "00 08 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Update missing-data records in Baserow
        run: python scripts/data_pipeline/sync_missing_catalog.py
        env:
          BASEROW_ACCESS_TOKEN: ${{ secrets.BASEROW_ACCESS_TOKEN }}
