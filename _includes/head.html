<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }} - {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/favicon.png">
  <meta name="description"
    content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta name="theme-color" content="#f4f6fb">

  <!-- Keep the browser canvas stable while blocking stylesheets load. -->
  <style>
    html,
    body {
      background: #f4f6fb;
    }
  </style>
  <link rel="preload" href="{{ site.baseurl }}/assets/css/main.css" as="style">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Work+Sans:wght@600;700;800&amp;display=swap"
    rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
    defer></script>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <script defer src="https://umami.datarescueproject.org/script.js"
    data-website-id="fd0203d9-86a6-4ccd-8d26-983dfa2362af"></script>

  {% if site.opengraph.enabled == true %}
  <!-- Open Graph -->
  {% include addons/opengraph.html %}
  {% endif %}

  <script>
    document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/, 'js');

    var settings = {
      BASE_URL: {{ site.baseurl | jsonify }} || ""
  }
  </script>

  {% if page.layout == 'dataset' %}
  <script defer src="https://unpkg.com/@popperjs/core@2"></script>
  <script defer src="https://unpkg.com/tippy.js@6"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.tippy) {
        window.tippy('.status-badge[data-tippy-content]', {
          theme: 'status',
          delay: [0, 0],
          duration: [100, 75],
          placement: 'top'
        });
      }
    });
  </script>
  {% endif %}

</head>
